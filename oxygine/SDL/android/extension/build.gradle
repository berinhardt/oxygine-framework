apply plugin: 'com.android.library'

android {
        namespace 'org.oxygine.lib.extension'
        compileSdkVersion rootProject.ext.compileSdkVersion

        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
                java.srcDirs = ['src']
                res.srcDirs = ['res']
            }
        }
}
